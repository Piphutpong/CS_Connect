<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Content-Security-Policy: ชั้นสุดท้ายที่ทำให้ "ต่อให้มีช่องโหว่จนแทรก
     สคริปต์ได้ ก็ส่งข้อมูลออกไปไหนไม่ได้" -- script-src กันสคริปต์ที่ไม่ได้มาจาก
     ไฟล์ของเราเอง และ connect-src อนุญาตให้ยิงได้เฉพาะ Apps Script
     ต้องมี script.googleusercontent.com ด้วย ไม่ใช่แค่ script.google.com:
     Apps Script ตอบทุก POST ด้วย 302 ไปโฮสต์นั้น และ CSP ตรวจปลายทางของ
     redirect ด้วย ไม่ใช่แค่ URL แรก ถ้าขาดไป ทุกคำสั่งจะล้มด้วยข้อความ
     "NetworkError when attempting to fetch resource" โดยไม่บอกว่าเป็นเพราะ CSP
     หมายเหตุ: frame-ancestors ใช้ผ่าน <meta> ไม่ได้ (ต้องเป็น HTTP header ซึ่ง
     GitHub Pages ตั้งให้ไม่ได้) การกันการถูกฝังใน iframe จึงยังทำไม่ได้ที่นี่ -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none';
        script-src 'self';
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
        font-src https://fonts.gstatic.com;
        img-src 'self' data: https://drive.google.com https://*.googleusercontent.com;
        connect-src https://script.google.com https://script.googleusercontent.com;
        form-action 'none';
        base-uri 'none';
        object-src 'none'">
<meta name="referrer" content="no-referrer">
<title>ติดตามสถานะคำร้อง - CS Connect</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Sarabun:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=20260909k">
</head>
<body>

<!-- Standalone page (not part of the index.html single-page app) so it can
     have its own short URL / QR code for customers, independent of the
     staff login app. See track.js for its script. -->
<section class="auth-view">
  <div class="auth-card track-card">
    <div class="brand">
      <div class="brand-mark">CS</div>
      <h1>ติดตามสถานะคำร้อง</h1>
      <p class="brand-sub">กรอกเลขที่คำร้อง (ระบบ) เพื่อตรวจสอบสถานะล่าสุด</p>
    </div>

    <form id="trackForm" class="auth-form" novalidate>
      <div class="field">
        <label for="trackNumber">เลขที่คำร้อง</label>
        <input type="text" id="trackNumber" placeholder="เช่น 690001" required autocomplete="off">
      </div>
      <div class="field">
        <label for="trackPhone">เบอร์โทรศัพท์ที่แจ้งไว้</label>
        <input type="tel" id="trackPhone" placeholder="เบอร์โทรศัพท์ที่ใช้ยื่นคำร้อง" required autocomplete="off">
      </div>
      <p id="trackError" class="form-error" hidden></p>
      <button type="submit" class="btn btn-primary btn-block">ตรวจสอบสถานะ</button>
    </form>

    <div id="trackResult" class="track-result" hidden>
      <dl class="track-result-details">
        <div><dt>ชื่อ</dt><dd id="trackResultName"></dd></div>
        <div><dt>เลขที่คำร้อง</dt><dd id="trackResultNumber"></dd></div>
        <div><dt>วันที่รับคำร้อง</dt><dd id="trackResultDate"></dd></div>
        <div class="plain"><dd id="trackResultPurpose"></dd></div>
        <div><dt>สถานะ</dt><dd><span id="trackStatusBadge" class="request-badge request-badge-status"></span></dd></div>
        <!-- ขึ้นเฉพาะตอนสถานะรอชำระเงิน -- ต้องรู้ยอดก่อนจึงจะโอนแล้วแนบสลิปได้ -->
        <div id="trackFeeRow" hidden><dt>ค่าธรรมเนียม</dt><dd id="trackResultFee" class="track-fee"></dd></div>
      </dl>

      <!-- อยู่นอก <dl> โดยตั้งใจ: เป็นข้อความทั้งบรรทัด ไม่ใช่คู่หัวข้อ-ค่า และ
           จะได้ไม่ติดกฎ display: flex ของแถวใน .track-result-details
           เนื้อหามาจาก Apps Script ตามสถานะ (ดู STATUS_CONTACTS ใน Code.gs) -->
      <p id="trackStatusNote" class="track-status-note" hidden></p>

      <div id="trackPaymentSection" class="track-payment" hidden>
        <p class="track-payment-heading">บัญชีสำหรับโอนเงิน</p>
        <!-- ค่าว่างโดยตั้งใจ: เลขบัญชีและชื่อหน่วยงานถูกย้ายไปฝั่งเซิร์ฟเวอร์
             (PAYMENT_ACCOUNT ใน Code.gs) แล้วส่งมาเฉพาะคนที่ค้นเจอคำร้องของ
             ตัวเองจริงและสถานะเป็น "รอชำระเงิน" -- ถ้าเขียนไว้ตรงนี้ ใครกด
             View Source ก็อ่านได้หมดโดยไม่ต้องค้นอะไรเลย -->
        <dl class="track-result-details">
          <div><dt>ชื่อบัญชี</dt><dd id="payAccountName"></dd></div>
          <div><dt>ธนาคาร</dt><dd id="payBank"></dd></div>
          <div><dt>สาขา</dt><dd id="payBranch"></dd></div>
          <div><dt>เลขที่บัญชี</dt><dd id="payAccountNumber"></dd></div>
        </dl>
      </div>

      <div id="trackSlipSection" class="track-slip">
        <p class="track-payment-heading">สลิปการโอนเงิน</p>
        <img id="trackSlipImage" alt="สลิปการโอนเงิน" hidden>

        <form id="trackSlipForm" class="auth-form" novalidate>
          <div class="field">
            <label for="trackSlipFile" id="trackSlipFileLabel">แนบสลิปการโอนเงิน</label>
            <input type="file" id="trackSlipFile" accept="image/*">
          </div>
          <p id="trackSlipError" class="form-error" hidden></p>
          <button type="submit" id="trackSlipSubmitBtn" class="btn btn-primary btn-block">ยืนยันการชำระเงิน</button>
        </form>
      </div>
    </div>
  </div>
</section>

<!-- ===== POPUP: SLIP UPLOAD SUCCESS ===== -->
<div id="slipSuccessModal" class="modal-overlay" hidden>
  <div class="modal-card">
    <span class="modal-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none"><path d="M20 6 9 17l-5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </span>
    <h3>แนบสลิปสำเร็จ</h3>
    <p>รอเจ้าหน้าที่ตรวจสอบการชำระเงิน</p>
    <button type="button" id="slipSuccessOkBtn" class="btn btn-primary btn-block">ตกลง</button>
  </div>
</div>

<!-- ?v= คือตัวบังคับให้เบราว์เซอร์โหลดไฟล์ใหม่ -- GitHub Pages ส่ง
     Cache-Control: max-age=600 มาด้วย แปลว่าหลัง push ไปแล้ว เบราว์เซอร์จะ
     ยังใช้ไฟล์เก่าต่ออีก 10 นาทีโดยไม่ถามเซิร์ฟเวอร์เลย ซึ่งเคยทำให้ผู้ใช้
     เจอหลังบ้านเวอร์ชันใหม่คู่กับ app.js เวอร์ชันเก่าพร้อมกัน แล้วเกิดอาการ
     ที่หาสาเหตุยากมาก
     **ต้องเปลี่ยนเลขนี้ทุกครั้งที่แก้ app.js / style.css / track.js / qr.js**
     ไม่งั้นผู้ใช้บางคนจะยังได้ไฟล์เก่าไปอีกพักใหญ่ -->
<script src="track.js?v=20260909k"></script>
</body>
</html>
